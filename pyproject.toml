[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blynk-provisioning"
dynamic = ["version"]
description = "Early-access Blynk.Inject-style BLE provisioning for Linux devices - get a device's Blynk credentials by pairing with the Blynk app"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anthony Elder" }]
keywords = ["blynk", "blynk-inject", "ble", "bluetooth", "provisioning", "linux", "raspberry-pi", "iot", "mqtt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
]
dependencies = [
    "paho-mqtt>=2.0,<3",
    "python-dotenv>=1.0",
    "bluez-peripheral>=0.1.7,<0.2",
]

[project.urls]
Homepage = "https://github.com/Blynk-Technologies/Blynk-Provisioning-Linux"
Issues = "https://github.com/Blynk-Technologies/Blynk-Provisioning-Linux/issues"

[tool.setuptools.dynamic]
version = { attr = "blynk_provisioning.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
